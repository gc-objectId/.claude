logging:
  #  config: classpath:logback-spring.xml
  pattern:
    # trace_id/span_id are the MDC keys written by the OpenTelemetry java agent's logback
    # instrumentation. They are the same W3C ids Sentry and X-Ray record, so a log line can be
    # joined to a trace in either system.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:--}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%X{trace_id:--}){blue}/%clr(%X{span_id:--}){cyan} %clr(%X{TENANT_ID:--}){blue} %clr(%X{USER_ID:--}){blue} %clr(%X{PATIENT_ID:--}){yellow} %clr(%X{OPERATION_ID:--}){green} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    ROOT: WARN
    com.guided.orci: DEBUG
    org.springframework: WARN
    #    org.springframework.security: DEBUG
    com.vladmihalcea.flexypool: INFO
    com.zaxxer: WARN
    ca.uhn.fhir.parser.LenientErrorHandler: ERROR
    # HAPI re-reports every interceptor exception at ERROR with a full framework stack. Our only FHIR
    # interceptor is EpicOAuthInterceptor, and its failures are already logged with the client and
    # endpoint at the token service plus business context at the calling service, so this logger only
    # ever duplicates. OFF rather than a higher level because logback has nothing above ERROR.
    ca.uhn.fhir.interceptor.executor.BaseInterceptorService: OFF
    com.sun.xml.ws: ERROR
    #    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: INFO
    #    org.hibernate.stat: DEBUG
    org.hibernate.SQL: INFO

    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: INFO
    #    org.hibernate.stat: DEBUG
    # Reflections swallows per-url/per-class scan exceptions at WARN/TRACE instead of
    # failing the scan; this logger is otherwise silent, so bumping it is the only way
    # to see a rule class silently dropped from the @RuleDefinition classpath scan.
    org.reflections.Reflections: TRACE
    #    org.springframework.jdbc.core.JdbcTemplate: TRACE
    #    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    # change to debug to see SQL
    net.ttddyy.dsproxy.listener.SLF4JQueryLoggingListener: WARN
    net.ttddyy.dsproxy: WARN

#    org.hibernate.event.internal.DefaultFlushEntityEventListener: TRACE

#    org.quartz: DEBUG
#    org.hibernate.SQL: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE

#    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
decorator:
  datasource:
    flexy-pool:
      # FlexyPool observes connection-acquisition latency; it does not resize the pool.
      # When acquisition is slow the constraint is usually database throughput rather than pool
      # capacity, and adding connections in that state increases contention instead of
      # throughput. Pool capacity is therefore sized explicitly per profile rather than grown
      # on demand. A max-overgrow-pool-size of 0 leaves the increment strategy unregistered.
      acquisition-strategy:
        increment-pool:
          max-overgrow-pool-size: 0
      threshold:
        connection:
          # Log an acquisition only once it is slow enough to matter to a request.
          acquisition: 1000
    datasource-proxy:
      multiline: false
      slow-query:
        enable-logging: true
        log-level: WARN
        threshold: 1s
      query:
        enable-logging: true
        log-level: DEBUG

