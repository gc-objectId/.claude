cors:
  allowed-origins: https://guidedor-stage.guidedclinical.com

frontend:
  url: https://guidedor-stage.guidedclinical.com

application.hostname: https://guidedor-stage.guidedclinical.com

hl7:
  outbound:
    medication-administration:
      host: hspecqx.partners.org
      port: 45391
      useTLS: false
      dryRun: true

rules.timer.save-mode: ACTION_NEEDED

tenants:
  initialize: true
  mayo:
    enabled: true
    fhir-r4-server-base-url: https://test-tls.mcc.apix.mayo.edu/epic-api/api/FHIR/R4
    oauth-token-endpoint: https://test-tls.mcc.apix.mayo.edu/epic-api/oauth2/token
    oauth-client-id: ${epic.oauth.client-id}
    observation-system: urn:oid:1.2.840.114350.1.13.451.3.7.2.768282
    mrn-system: urn:oid:1.2.840.114350.1.13.451.3.7.5.737384.135000
    person-id-system: urn:oid:1.2.840.114350.1.13.451.3.7.5.737384.135
    provider-id-system: urn:oid:1.2.840.114350.1.13.451.3.7.5.737384.6
  demo:
    timer-job-enabled: false
    vital-signs: opt_in
    qa:
      enabled: true
  mgb:
    # MGB is served on the on-prem partners.org deployments, not on AWS.
    enabled: false
    timer-job-enabled: false
    vital-signs: always_disabled
    fhir:
      condition: R4
      creatinine: R4
      laboratory: R4
      height: R4
      weight: R4
      blood-pressure: R4
      patient: R4
      # no R4 for medication statement
      medication-statement: DSTU2
      allergy: R4
logging:
  # See application-aws-dev.yml for why AWS environments log ECS-format JSON.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ORCI
        environment: stage
  level:
    com.zaxxer.hikari: WARN

decorator:
  datasource:
    flexy-pool:
      acquisition-strategy:
        increment-pool:
          max-overgrow-pool-size: 0
      threshold:
        connection:
          acquisition: 1000
    datasource-proxy:
      slow-query:
        threshold: 300ms

sentry:
  environment: guidedor-stage.guidedclinical.com
  enabled: true
  logging:
    enabled: true
    minimum-event-level: error # Only send ERROR+ as events
    minimum-breadcrumb-level: info # Capture INFO+ as breadcrumbs for context

management:
  endpoints:
    web:
      exposure:
        include: metrics,health,info

  health:
    defaults:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      cloudwatch:
        namespace: OrciAppMetrics
        batch-size: 20
        step: 1m
springdoc:
  api-docs:
    enabled: false
